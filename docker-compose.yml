version: '3.9'


services:
  ts-server:
    build:
      context: ./ts
      dockerfile: Dockerfile
    container_name: ts-server
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - RABBITMQ_URI=amqp://rabbit:rabbitpass@rabbitmq:5672
    depends_on:
      - rabbitmq

  python-ai-agent:
    build:
      context: ./python
      dockerfile: Dockerfile
    container_name: python-worker
    depends_on:
      - rabbitmq
      - postgres
    environment:
      - RABBITMQ_USER=rabbit
      - RABBITMQ_PASS=rabbitpass
      - POSTGRES_URI=postgresql://postgres:test@postgres:5432/bot-sql
      - GOOGLE_API_KEY=insert_your_google_api_key_here
      - RABBITMQ_HOST=rabbitmq
    restart: always


  postgres:
    image: postgres:13-alpine
    restart: always
    volumes:
      - ./volumes/postgres:/var/lib/postgresql:rw,z
    expose:
      - 5432
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=test
      - POSTGRES_EXTERNAL_PORT=5432
      - POSTGRES_DB=bot-sql
      - PYTHONUNBUFFERED=1

  rabbitmq:
    image: rabbitmq:4.1-rc-alpine
    hostname: rabbitmq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=rabbit
      - RABBITMQ_DEFAULT_PASS=rabbitpass
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit disk_free_limit 2147483648
    volumes:
      - ./volumes/rabbitmq:/var/lib/rabbitmq
    ports:
      - 5672:5672

  flyway:
    image: flyway/flyway:9
    depends_on:
      - postgres
    command: -url=jdbc:postgresql://postgres:5432/bot-sql -user=postgres -password=test -schemas=public migrate
    volumes:
      - ./migrations:/flyway/sql:ro